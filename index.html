  <file_content><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Noviembre 2026 - Ultra Modern</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.25);
            --danger-color: #f43f5e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        h1 {
            font-size: 1.5em;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 4px 0;
        }

        .subtitle {
            font-size: 0.8em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Dashboards Cards Neo-Glass */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .summary-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            text-align: left;
        }

        .metric-card.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .metric-label {
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .metric-value {
            font-size: 1.3em;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .metric-value.income { color: var(--success-color); }
        .metric-value.expense { color: var(--danger-color); }
        .metric-value.balance { 
            color: #ffffff; 
            font-size: 1.6em;
            background: linear-gradient(135deg, #ffffff 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 0.95em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-accent);
            box-shadow: 0 0 8px var(--primary-accent);
        }

        .add-btn {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary-accent);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.78em;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn:active {
            transform: scale(0.95);
            background: var(--primary-accent);
            color: #fff;
        }

        /* Modern List Inputs */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 4px 6px 4px 12px;
        }

        .item-row:focus-within {
            border-color: var(--primary-accent);
            box-shadow: 0 0 12px var(--primary-glow);
            background: rgba(30, 41, 59, 0.8);
        }

        .item-row input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.88em;
            font-weight: 500;
            outline: none;
        }

        .item-row input[type="number"] {
            width: 110px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.9em;
            font-weight: 700;
            text-align: right;
            outline: none;
            font-family: monospace;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: rgba(244, 63, 94, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1em;
        }

        .delete-btn:active {
            color: var(--danger-color);
            background: rgba(244, 63, 94, 0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Noviembre 2026</h1>
        <span class="subtitle">Finanzas Personales</span>
    </header>

    <!-- Dashboard de Indicadores Principal -->
    <div class="summary-dashboard">
        <div class="metric-card full-width">
            <span class="metric-label">Superávit Libre Estimado</span>
            <span id="net-balance" class="metric-value balance">$0</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Ingresos Totales</span>
            <span id="total-income" class="metric-value income">$0</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Gastos Totales</span>
            <span id="total-expenses" class="metric-value expense">$0</span>
        </div>
    </div>

    <!-- SECCIÓN INGRESOS -->
    <section class="glass-card">
        <div class="section-header">
            <span class="section-title">Ingresos</span>
            <button class="add-btn" onclick="addRow('income-list')">+ Nuevo</button>
        </div>
        <div id="income-list" class="item-list">
            <div class="item-row">
                <input type="text" value="Sueldo Neto Base Promedio">
                <input type="number" class="income-value" value="2771500" oninput="calculate()">
                <button class="delete-btn" onclick="removeRow(this)">×</button>
            </div>
            <div class="item-row">
                <input type="text" value="Recupero Préstamo U.F.">
                <input type="number" class="income-value" value="232333.33" oninput="calculate()">
                <button class="delete-btn" onclick="removeRow(this)">×</button>
            </div>
            <div class="item-row">
                <input type="text" value="Feriado Trabajado">
                <input type="number" class="income-value" value="108500" oninput="calculate()">
                <button class="delete-btn" onclick="removeRow(this)">×</button>
            </div>
        </div>
    </section>

    <!-- SECCIÓN GASTOS -->
    <section class="glass-card">
        <div class="section-header">
            <span class="section-title">Gastos y Servicios</span>
            <button class="add-btn" onclick="addRow('expense-list')">+ Nuevo</button>
        </div>
        <div id="expense-list" class="item-list">
            <div class="item-row"><input type="text" value="Crédito 1"><input type="number" class="expense-value" value="1050000" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Crédito 2"><input type="number" class="expense-value" value="200000" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Supermercado ($200k/sem)"><input type="number" class="expense-value" value="800000" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Carnicería / Verdulería"><input type="number" class="expense-value" value="250000" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Personal Internet + Flow"><input type="number" class="expense-value" value="216324" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Edesur (Luz)"><input type="number" class="expense-value" value="94570.28" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Metrogas (Gas)"><input type="number" class="expense-value" value="74139.23" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Personal Móvil"><input type="number" class="expense-value" value="36160" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Movistar Compra"><input type="number" class="expense-value" value="28573.40" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Movistar Móvil"><input type="number" class="expense-value" value="15002.23" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Transporte"><input type="number" class="expense-value" value="75000" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Deportes"><input type="number" class="expense-value" value="38000" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Xbox"><input type="number" class="expense-value" value="24902.79" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="YouTube"><input type="number" class="expense-value" value="13515.28" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Spotify"><input type="number" class="expense-value" value="9984.22" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Crunchyroll"><input type="number" class="expense-value" value="9209.49" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Prime Video"><input type="number" class="expense-value" value="7863.79" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
            <div class="item-row"><input type="text" value="Meli+"><input type="number" class="expense-value" value="5490" oninput="calculate()"><button class="delete-btn" onclick="removeRow(this)">×</button></div>
        </div>
    </section>
</div>

<script>
    function formatCurrency(val) {
        return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(val);
    }

    function calculate() {
        let totalIncome = 0;
        let totalExpense = 0;

        document.querySelectorAll('.income-value').forEach(input => {
            totalIncome += parseFloat(input.value) || 0;
        });

        document.querySelectorAll('.expense-value').forEach(input => {
            totalExpense += parseFloat(input.value) || 0;
        });

        let balance = totalIncome - totalExpense;

        document.getElementById('total-income').innerText = formatCurrency(totalIncome);
        document.getElementById('total-expenses').innerText = formatCurrency(totalExpense);
        
        const balanceEl = document.getElementById('net-balance');
        balanceEl.innerText = formatCurrency(balance);
    }

    function addRow(containerId) {
        const container = document.getElementById(containerId);
        const isIncome = containerId === 'income-list';
        const valueClass = isIncome ? 'income-value' : 'expense-value';

        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <input type="text" placeholder="Nuevo concepto">
            <input type="number" class="${valueClass}" value="0" oninput="calculate()">
            <button class="delete-btn" onclick="removeRow(this)">×</button>
        `;
        container.appendChild(row);
    }

    function removeRow(btn) {
        btn.parentElement.remove();
        calculate();
    }

    calculate();
</script>

</body>
</html>
