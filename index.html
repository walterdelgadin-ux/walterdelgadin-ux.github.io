  <file_content><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Noviembre 2026 - Ultra Modern Pro</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --success-color: #10b981;
            --danger-color: #f43f5e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 8px;
        }

        h1 {
            font-size: 1.5em;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 4px 0;
        }

        .subtitle {
            font-size: 0.8em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Barra de Herramientas (Guardar y Deshacer) */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tool-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.82em;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .tool-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .tool-btn:not(:disabled):active {
            transform: scale(0.96);
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-accent);
        }

        .tool-btn.save-btn {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success-color);
        }

        .tool-btn.save-btn:active {
            background: var(--success-color);
            color: #000;
        }

        /* Dashboards Cards Neo-Glass */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .summary-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            text-align: left;
        }

        .metric-card.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .metric-label {
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .metric-value {
            font-size: 1.3em;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .metric-value.income { color: var(--success-color); }
        .metric-value.expense { color: var(--danger-color); }
        .metric-value.balance { 
            color: #ffffff; 
            font-size: 1.6em;
            background: linear-gradient(135deg, #ffffff 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 0.95em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-accent);
            box-shadow: 0 0 8px var(--primary-accent);
        }

        .add-btn {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary-accent);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.78em;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn:active {
            transform: scale(0.95);
            background: var(--primary-accent);
            color: #fff;
        }

        /* Modern List Inputs */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 4px 6px 4px 12px;
        }

        .item-row:focus-within {
            border-color: var(--primary-accent);
            box-shadow: 0 0 12px var(--primary-glow);
            background: rgba(30, 41, 59, 0.8);
        }

        .item-row input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.88em;
            font-weight: 500;
            outline: none;
        }

        .item-row input[type="number"] {
            width: 110px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.9em;
            font-weight: 700;
            text-align: right;
            outline: none;
            font-family: monospace;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: rgba(244, 63, 94, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1em;
        }

        .delete-btn:active {
            color: var(--danger-color);
            background: rgba(244, 63, 94, 0.15);
        }

        /* Toast de confirmación */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.9);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Presupuesto 💵</h1>
        <span class="subtitle">Finanzas Personales</span>
    </header>

    <!-- Barra de Acciones (Deshacer y Guardar) -->
    <div class="toolbar">
        <button id="undo-btn" class="tool-btn" onclick="undo()" disabled>
            ↩ Volver atrás
        </button>
        <button class="tool-btn save-btn" onclick="saveData()">
            💾 Guardar cambios
        </button>
    </div>

    <!-- Dashboard de Indicadores Principal -->
    <div class="summary-dashboard">
        <div class="metric-card full-width">
            <span class="metric-label">Superávit Libre Estimado</span>
            <span id="net-balance" class="metric-value balance">$0</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Ingresos Totales</span>
            <span id="total-income" class="metric-value income">$0</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Gastos Totales</span>
            <span id="total-expenses" class="metric-value expense">$0</span>
        </div>
    </div>

    <!-- SECCIÓN INGRESOS -->
    <section class="glass-card">
        <div class="section-header">
            <span class="section-title">Ingresos</span>
            <button class="add-btn" onclick="addRow('income-list')">+ Nuevo</button>
        </div>
        <div id="income-list" class="item-list"></div>
    </section>

    <!-- SECCIÓN GASTOS -->
    <section class="glass-card">
        <div class="section-header">
            <span class="section-title">Gastos y Servicios</span>
            <button class="add-btn" onclick="addRow('expense-list')">+ Nuevo</button>
        </div>
        <div id="expense-list" class="item-list"></div>
    </section>
</div>

<div id="toast" class="toast">✓ Datos guardados localmente</div>

<script>
    // Datos por defecto
    const defaultData = {
        incomes: [
            { text: "Sueldo Neto Base Promedio", val: 2771500 },
            { text: "Recupero Préstamo U.F.", val: 232333.33 },
            { text: "Feriado Trabajado", val: 108500 }
        ],
        expenses: [
            { text: "Crédito 1", val: 1050000 },
            { text: "Crédito 2", val: 200000 },
            { text: "Supermercado ($200k/sem)", val: 800000 },
            { text: "Carnicería / Verdulería", val: 250000 },
            { text: "Personal Internet + Flow", val: 216324 },
            { text: "Edesur (Luz)", val: 94570.28 },
            { text: "Metrogas (Gas)", val: 74139.23 },
            { text: "Personal Móvil", val: 36160 },
            { text: "Movistar Compra", val: 28573.40 },
            { text: "Movistar Móvil", val: 15002.23 },
            { text: "Transporte", val: 75000 },
            { text: "Deportes", val: 38000 },
            { text: "Xbox", val: 24902.79 },
            { text: "YouTube", val: 13515.28 },
            { text: "Spotify", val: 9984.22 },
            { text: "Crunchyroll", val: 9209.49 },
            { text: "Prime Video", val: 7863.79 },
            { text: "Meli+", val: 5490 }
        ]
    };

    let historyStack = [];

    // Formateador de moneda
    function formatCurrency(val) {
        return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(val);
    }

    // Captura el estado actual antes de un cambio
    function pushState() {
        const state = getCurrentData();
        historyStack.push(JSON.stringify(state));
        document.getElementById('undo-btn').disabled = false;
    }

    // Deshacer la última acción
    function undo() {
        if (historyStack.length > 0) {
            const previousState = JSON.parse(historyStack.pop());
            renderData(previousState);
            calculate();
            if (historyStack.length === 0) {
                document.getElementById('undo-btn').disabled = true;
            }
        }
    }

    // Obtener los datos actualmente visibles en pantalla
    function getCurrentData() {
        const incomes = [];
        document.querySelectorAll('#income-list .item-row').forEach(row => {
            incomes.push({
                text: row.querySelector('input[type="text"]').value,
                val: parseFloat(row.querySelector('input[type="number"]').value) || 0
            });
        });

        const expenses = [];
        document.querySelectorAll('#expense-list .item-row').forEach(row => {
            expenses.push({
                text: row.querySelector('input[type="text"]').value,
                val: parseFloat(row.querySelector('input[type="number"]').value) || 0
            });
        });

        return { incomes, expenses };
    }

    // Renderizar una lista de datos en el DOM
    function renderData(data) {
        const incomeList = document.getElementById('income-list');
        const expenseList = document.getElementById('expense-list');
        
        incomeList.innerHTML = '';
        expenseList.innerHTML = '';

        data.incomes.forEach(item => incomeList.appendChild(createRow(item.text, item.val, 'income-value')));
        data.expenses.forEach(item => expenseList.appendChild(createRow(item.text, item.val, 'expense-value')));
    }

    // Crear un elemento de fila
    function createRow(text, val, valueClass) {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <input type="text" value="${text}" onfocus="pushState()" onchange="calculate()">
            <input type="number" class="${valueClass}" value="${val}" onfocus="pushState()" oninput="calculate()">
            <button class="delete-btn" onclick="removeRow(this)">×</button>
        `;
        return row;
    }

    function addRow(containerId) {
        pushState();
        const container = document.getElementById(containerId);
        const isIncome = containerId === 'income-list';
        const valueClass = isIncome ? 'income-value' : 'expense-value';
        container.appendChild(createRow('', 0, valueClass));
        calculate();
    }

    function removeRow(btn) {
        pushState();
        btn.parentElement.remove();
        calculate();
    }

    function calculate() {
        let totalIncome = 0;
        let totalExpense = 0;

        document.querySelectorAll('.income-value').forEach(input => {
            totalIncome += parseFloat(input.value) || 0;
        });

        document.querySelectorAll('.expense-value').forEach(input => {
            totalExpense += parseFloat(input.value) || 0;
        });

        let balance = totalIncome - totalExpense;

        document.getElementById('total-income').innerText = formatCurrency(totalIncome);
        document.getElementById('total-expenses').innerText = formatCurrency(totalExpense);
        document.getElementById('net-balance').innerText = formatCurrency(balance);
    }

    // Guardar información en LocalStorage
    function saveData() {
        const data = getCurrentData();
        localStorage.setItem('presupuesto_data', JSON.stringify(data));
        
        const toast = document.getElementById('toast');
        toast.className = 'toast show';
        setTimeout(() => toast.className = 'toast', 2000);
    }

    // Cargar información al iniciar
    function loadData() {
        const saved = localStorage.getItem('presupuesto_data');
        if (saved) {
            try {
                renderData(JSON.parse(saved));
            } catch(e) {
                renderData(defaultData);
            }
        } else {
            renderData(defaultData);
        }
        calculate();
    }

    loadData();
</script>

</body>
</html>
