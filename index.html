    <style>

        .tool-btn.super-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.25) 100%);

        /* Dashboard Indicadores */
        .summary-dashboard {
            display: grid;

        .add-item-btn:active {

        .delete-category-btn {
            background: transparent;

            color: rgba(244, 63, 94, 0.5);

        /* Filas de ítems */
        .item-list {
            display: flex;

            border-radius: 12px;

        }

        .item-row input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.85em;
            outline: none;
        }

        .item-row input[type="number"] {
            width: 105px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.88em;
            font-weight: 700;
            text-align: right;
            outline: none;
            font-family: monospace;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: rgba(244, 63, 94, 0.4);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1em;
        }

        .delete-btn:active {
            color: var(--danger-color);
        }

        /* Botón de Nueva Categoría */
        .add-category-bar {
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .add-cat-btn {
            width: 100%;
            background: rgba(99, 102, 241, 0.12);
            border: 1px dashed rgba(99, 102, 241, 0.4);
            border-radius: 16px;
            padding: 12px;
            color: var(--primary-accent);
            font-size: 0.88em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .add-cat-btn:active {
            background: rgba(99, 102, 241, 0.25);
            transform: scale(0.98);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.95);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PRESUPUESTO 💵</h1>
        <span class="subtitle">Finanzas Personales Categorizadas</span>

    <!-- Toolbar de Acción -->
    <div class="toolbar">
        <button id="undo-btn" class="tool-btn" onclick="undo()" disabled>
            ↩ Atrás
        </button>
        <button class="tool-btn save-btn" onclick="saveData()">
            💾 Guardar
        </button>

    <!-- Planificador de Superávit -->
    <div class="nav-bar">

    <div class="summary-dashboard">

    <!-- SECCIÓN INGRESOS -->
    <div id="income-section"></div>

    <!-- SECCIÓN GASTOS (CATEGORÍAS DINÁMICAS) -->
    <div id="categories-container"></div>

    <!-- BOTÓN AGREGAR CATEGORÍA -->
    <div class="add-category-bar">
        <button class="add-cat-btn" onclick="addNewCategory()">

        </button>
    </div>

<div id="toast" class="toast">✓ Cambios guardados correctamente</div>

<script>
    // Configuración inicial por defecto con Categorías y Colores
    const defaultData = {
        incomeCategory: {
            title: "Ingresos",
            color: "#10b981",
            items: [
                { text: "Sueldo Neto Base Promedio", val: 2771500 },
                { text: "Recupero Préstamo U.F.", val: 232333.33 },
                { text: "Feriado Trabajado", val: 108500 }
            ]
        },
        expenseCategories: [
            {
                id: "cat_deudas",
                title: "Créditos y Deudas",
                color: "#f43f5e",
                items: [
                    { text: "Crédito 1", val: 1050000 },
                    { text: "Crédito 2", val: 200000 }
                ]
            },
            {
                id: "cat_alimentacion",
                title: "Alimentación y Hogar",
                color: "#f59e0b",
                items: [
                    { text: "Supermercado ($200k/sem)", val: 800000 },
                    { text: "Carnicería / Verdulería", val: 250000 }
                ]
            },
            {
                id: "cat_servicios",
                title: "Servicios del Hogar",
                color: "#3b82f6",
                items: [
                    { text: "Personal Internet + Flow", val: 216324 },
                    { text: "Edesur (Luz)", val: 94570.28 },
                    { text: "Metrogas (Gas)", val: 74139.23 },
                    { text: "Personal Móvil", val: 36160 },
                    { text: "Movistar Compra", val: 28573.40 },
                    { text: "Movistar Móvil", val: 15002.23 }
                ]
            },
            {
                id: "cat_ocio",
                title: "Ocio, Deporte y Suscripciones",
                color: "#a855f7",
                items: [
                    { text: "Transporte", val: 75000 },
                    { text: "Deportes", val: 38000 },
                    { text: "Xbox", val: 24902.79 },
                    { text: "YouTube", val: 13515.28 },
                    { text: "Spotify", val: 9984.22 },
                    { text: "Crunchyroll", val: 9209.49 },
                    { text: "Prime Video", val: 7863.79 },
                    { text: "Meli+", val: 5490 }
                ]
            }
        ]
    };

    let historyStack = [];

    function formatCurrency(val) {
        return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(val);
    }

    function pushState() {
        const state = getCurrentData();
        historyStack.push(JSON.stringify(state));
        document.getElementById('undo-btn').disabled = false;
    }

    function undo() {
        if (historyStack.length > 0) {
            const previousState = JSON.parse(historyStack.pop());
            renderData(previousState);
            calculate();
            if (historyStack.length === 0) {
                document.getElementById('undo-btn').disabled = true;
            }
        }
    }

    function getCurrentData() {
        // Obtener Ingresos
        const incomeInc = {
            title: "Ingresos",
            color: document.getElementById('income-color-picker')?.value || "#10b981",
            items: []
        };
        document.querySelectorAll('#income-items .item-row').forEach(row => {
            incomeInc.items.push({
                text: row.querySelector('input[type="text"]').value,
                val: parseFloat(row.querySelector('input[type="number"]').value) || 0
            });
        });

        // Obtener Categorías de Gastos
        const expenseCategories = [];
        document.querySelectorAll('.expense-category-card').forEach(card => {
            const catId = card.id;
            const title = card.querySelector('.category-title').value;
            const color = card.querySelector('.color-picker-input').value;
            const items = [];
            card.querySelectorAll('.item-row').forEach(row => {
                items.push({
                    text: row.querySelector('input[type="text"]').value,
                    val: parseFloat(row.querySelector('input[type="number"]').value) || 0
                });
            });
            expenseCategories.push({ id: catId, title, color, items });
        });

        return { incomeCategory: incomeInc, expenseCategories };
    }

    function renderData(data) {
        // Render Ingresos
        const incomeSec = document.getElementById('income-section');
        incomeSec.innerHTML = `
            <div class="category-card" style="--category-color: ${data.incomeCategory.color};">
                <div class="category-header">
                    <div class="category-title-wrap">
                        <input type="color" id="income-color-picker" class="color-picker-input" value="${data.incomeCategory.color}" onchange="updateIncomeColor(this.value)">
                        <span style="font-weight:700; font-size:1em; color:var(--text-main);">Ingresos</span>
                    </div>
                    <button class="add-item-btn" onclick="addItemToCategory('income-items', 'income')">+ Ítem</button>
                </div>
                <div id="income-items" class="item-list"></div>
            </div>
        `;

        const incomeItemsCont = document.getElementById('income-items');
        data.incomeCategory.items.forEach(item => {
            incomeItemsCont.appendChild(createRow(item.text, item.val, 'income-val'));
        });

        // Render Gastos
        const catContainer = document.getElementById('categories-container');
        catContainer.innerHTML = '';
        data.expenseCategories.forEach(cat => {
            catContainer.appendChild(createCategoryCard(cat));
        });
    }

    function updateIncomeColor(color) {
        pushState();
        document.getElementById('income-section').querySelector('.category-card').style.setProperty('--category-color', color);
    }

    function createCategoryCard(cat) {
        const card = document.createElement('div');
        card.className = 'category-card expense-category-card';
        card.id = cat.id || 'cat_' + Date.now();
        card.style.setProperty('--category-color', cat.color);

        card.innerHTML = `
            <div class="category-header">
                <div class="category-title-wrap">
                    <input type="color" class="color-picker-input" value="${cat.color}" onchange="changeCategoryColor('${card.id}', this.value)">
                    <input type="text" class="category-title" value="${cat.title}" onfocus="pushState()" onchange="calculate()">
                </div>
                <button class="add-item-btn" onclick="addItemToCategory('${card.id}_items', 'expense')">+ Ítem</button>
                <button class="delete-category-btn" onclick="deleteCategory('${card.id}')">✕</button>
            </div>
            <div id="${card.id}_items" class="item-list"></div>
        `;

        const itemsCont = card.querySelector('.item-list');
        cat.items.forEach(item => {
            itemsCont.appendChild(createRow(item.text, item.val, 'expense-val'));
        });

        return card;
    }

    function changeCategoryColor(catId, color) {
        pushState();
        document.getElementById(catId).style.setProperty('--category-color', color);
    }

    function createRow(text, val, valueClass) {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <input type="
