<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PCZ Asistente de Novedades</title>
  <meta name="theme-color" content="#121820">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --primary: #238636;
      --primary-hover: #2ea043;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-white: #f0f6fc;
      --tag-bg: #21262d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; font-size: 14px; }
    .container { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 16px; color: var(--text-white); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h1 span { font-size: 11px; background: var(--border); padding: 2px 6px; border-radius: 4px; color: #8b949e; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 11px; font-weight: 600; color: #8b949e; text-transform: uppercase; margin-bottom: 3px; display: block; }
    select, input, textarea {
      width: 100%; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: var(--text-white); padding: 9px 10px; font-size: 14px; outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .badge-box { display: flex; gap: 8px; }
    .badge {
      flex: 1; background: var(--tag-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center;
    }
    .badge-title { font-size: 10px; color: #8b949e; font-weight: 700; text-transform: uppercase; }
    .badge-value { font-size: 18px; font-weight: 800; color: #3fb950; margin-top: 2px; }
    .badge-avisos { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 2px; letter-spacing: 1px; }
    textarea { resize: none; font-family: monospace; font-size: 12px; line-height: 1.4; color: #7ee787; background: #030712; }
    .btn {
      width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
    }
    .btn:active { background: var(--primary-hover); transform: scale(0.98); }
  </style>
</head>
<body>

<div class="container">
  <h1>PCZ - ASISTENTE DE NOVEDADES <span>V2.0 COMPLETO</span></h1>

  <div class="card">
    <div>
      <label>Tipo de Evento</label>
      <select id="tipoEvento" onchange="actualizarPlantilla()">
        <optgroup label="Seguridad de Marcha / Conducción">
          <option value="ATS">801 - Aplicación de A.T.S. (Corte/Display)</option>
          <option value="HV">51 - Hombre Vivo / Pedal no responde</option>
          <option value="PRECAUCION">78 - Precaución Km 23/737 Exceso Pasaje</option>
        </optgroup>
        <optgroup label="Material Rodante / Coches">
          <option value="FRENO">101 - Freno en Coches / Afloje Manual</option>
          <option value="TRACCION">100 - Falla de Tracción / Poca Potencia / GR</option>
          <option value="CAMBIO_LOC">100 - Cambio de Locomotora / Rotación</option>
          <option value="LUZ_PUERTA">103 - Coche s/Luz / Puerta / Cadena floja</option>
        </optgroup>
        <optgroup label="Pasajeros / Policía / Seguridad">
          <option value="CAIDA">81 - Pasajero Caído en Andén al asc/desc</option>
          <option value="DESCOMP">71 - Pasajero Descompensado / SAME</option>
          <option value="POLICIA">78 - Intervención Policial / Gresca / Ebriedad</option>
          <option value="ARREBATO">78 - Arrebato / Robo de Celular</option>
          <option value="APEDREO">78 - Apedreo a Formación / Vidrio roto</option>
          <option value="VIA">15 - Persona / Menor en Zona de Vías</option>
          <option value="OBITO">80 - Accidente Fatal / Óbito / Arrollamiento</option>
          <option value="CABALLOS">15 - Animales / Equinos en Zona de Vías</option>
          <option value="CUSTODIA">78 - Falta de Custodia Policial</option>
        </optgroup>
        <optgroup label="Infraestructura / Señalamiento / Vía">
          <option value="PAN">40 - P.A.N. / Barrera Dañada / Brazo roto</option>
          <option value="SENAL">41 - Señal Apagada / Circuito Ocupado</option>
          <option value="CAMBIO_ADV">42 - Cambio (A.D.V.) Fuera de Corresp.</option>
          <option value="OBRA">63 - Vía y Obras / Entrega / Mecanizado</option>
        </optgroup>
      </select>
    </div>

    <div class="row">
      <div>
        <label>Tren</label>
        <input type="text" id="tren" placeholder="3081" oninput="generar()">
      </div>
      <div>
        <label>Locomotora</label>
        <input type="text" id="loc" placeholder="EM02" oninput="generar()">
      </div>
      <div>
        <label>Coches (Punta/Punta)</label>
        <input type="text" id="coches" placeholder="4983/4912" oninput="generar()">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Personal (Rol / Apellido / Leg.)</label>
        <input type="text" id="personal" placeholder="COND. CAPELLETTI (3051)" oninput="generar()">
      </div>
      <div>
        <label>Lugar / Estación / Km</label>
        <input type="text" id="lugar" placeholder="EST. GRIERSON" oninput="generar()">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Minutos Atraso</label>
        <input type="number" id="minutos" placeholder="4" oninput="generar()">
      </div>
      <div id="campoExtraCont">
        <label id="lblExtra">Detalle Extra</label>
        <input type="text" id="extra" placeholder="Cortó pcto 2527478" oninput="generar()">
      </div>
    </div>
  </div>

  <div class="badge-box">
    <div class="badge">
      <div class="badge-title">Código Carga</div>
      <div class="badge-value" id="boxCarga">801</div>
    </div>
    <div class="badge">
      <div class="badge-title">Cadena de Avisos</div>
      <div class="badge-avisos" id="boxAvisos">1 2 3 10 11 35</div>
    </div>
  </div>

  <div class="card">
    <label>Texto Estandarizado (3 Líneas)</label>
    <textarea id="salidaTexto" rows="5" readonly></textarea>
    <button class="btn" onclick="copiarAlPortapapeles()">📋 COPIAR NOVEDAD Y CÓDIGOS</button>
  </div>
</div>

<script>
  const configuraciones = {
    ATS: { carga: "801", avisos: "1 2 3 10 11 35", extraLbl: "N° Precinto / Display", extraPh: "Cortó pcto 2527478 (3 líneas)" },
    HV: { carga: "51", avisos: "1 2 3 10 11", extraLbl: "Detalle Dispositivo", extraPh: "No respondió pedal, repone y reanuda" },
    PRECAUCION: { carga: "78", avisos: "1 2 3", extraLbl: "Sentido / Velocidad", extraPh: "Sentido desc. a 12 km/h por sobrecarga" },
    
    FRENO: { carga: "101", avisos: "1 2 3 10", extraLbl: "Coche Afectado / Reserva", extraPh: "Afloje coche 4410, dejó EM02 Retiro" },
    TRACCION: { carga: "100", avisos: "1 2 3 10", extraLbl: "Acción Motores", extraPh: "Anuló 2/5 por patinaje, máx 45 km/h" },
    CAMBIO_LOC: { carga: "100", avisos: "1 2 3 10", extraLbl: "Motivo / Nueva Loc", extraPh: "Por baja potencia, continúa con E717" },
    LUZ_PUERTA: { carga: "103", avisos: "1 2 3 10", extraLbl: "Coche / Falla", extraPh: "Coche 4421 sin luz, normaliza M/R" },
    
    CAIDA: { carga: "81", avisos: "1 2 3 7 8 11", extraLbl: "Estado Pasajero", extraPh: "Se retira s/datos, no requiere SAME" },
    DESCOMP: { carga: "71", avisos: "1 2 3 7 12", extraLbl: "Datos SAME / Acta", extraPh: "Móvil 38 SAME, firma acta s/traslado" },
    POLICIA: { carga: "78", avisos: "1 2 3 7 17", extraLbl: "Motivo Intervención", extraPh: "Gresca a bordo, descienden 2 masculinos" },
    ARREBATO: { carga: "78", avisos: "1 2 3 7 11 17", extraLbl: "Detalle Hecho", extraPh: "Arrebato en andén, delincuente a la fuga" },
    APEDREO: { carga: "78", avisos: "1 2 3 7 11", extraLbl: "Coche / Daño", extraPh: "Acrílico capot corto roto, sin lesiones" },
    VIA: { carga: "15", avisos: "1 2 3 7 11", extraLbl: "Resolución", extraPh: "F/E preventivo, persona se retira de traza" },
    OBITO: { carga: "80", avisos: "1 2 3 7 8 10 11 19", extraLbl: "Vía / V.S.P.", extraPh: "Óbito en traza, se establece V.S.P." },
    CABALLOS: { carga: "15", avisos: "1 2 3 7", extraLbl: "Progresiva Km", extraPh: "Equinos en vía km 44/500, marcha a la vista" },
    CUSTODIA: { carga: "78", avisos: "1 2 3 7", extraLbl: "Motivo / Destacamento", extraPh: "Falta de efectivo policial al partir" },
    
    PAN: { carga: "40", avisos: "1 2 3 4 7", extraLbl: "Brazo / Barrera", extraPh: "Brazo asc. roto, c/custodia" },
    SENAL: { carga: "41", avisos: "1 2 3 4", extraLbl: "Señal / Aspecto", extraPh: "Señal 153 a peligro / Circuito ocupado" },
    CAMBIO_ADV: { carga: "42", avisos: "1 2 3 4", extraLbl: "N° Cambio / Posición", extraPh: "Cambio 4 fuera de corresp. en invertido" },
    OBRA: { carga: "63", avisos: "1 2 3 6 7", extraLbl: "Sector / Tareas", extraPh: "Vía desc. bateo y soldaduras km 24 al 25" }
  };

  function actualizarPlantilla() {
    const t = document.getElementById("tipoEvento").value;
    const cfg = configuraciones[t];
    document.getElementById("boxCarga").innerText = cfg.carga;
    document.getElementById("boxAvisos").innerText = cfg.avisos;
    document.getElementById("lblExtra").innerText = cfg.extraLbl;
    document.getElementById("extra").placeholder = cfg.extraPh;
    generar();
  }

  function generar() {
    const tipo = document.getElementById("tipoEvento").value;
    const cfg = configuraciones[tipo];
    const tren = document.getElementById("tren").value.trim() || "[TREN]";
    const loc = document.getElementById("loc").value.trim() || "[LOC]";
    const coches = document.getElementById("coches").value.trim();
    const pers = document.getElementById("personal").value.trim() || "COND. [APELLIDO] ([LEG])";
    const lugar = document.getElementById("lugar").value.trim() || "[LUGAR]";
    const min = document.getElementById("minutos").value.trim();
    const extra = document.getElementById("extra").value.trim();

    const cochesTxt = coches ? ` (${coches})` : "";
    const minTxt = min ? ` CON ${min} MIN. ATRASO` : "";
    const extraTxt = extra ? ` ${extra}.` : "";

    let l1 = `${pers} - T/${tren} LOC.${loc}${cochesTxt}`;
    let l2 = "";
    let l3 = "";

    switch(tipo) {
      case "ATS":
        l2 = `INF. EN ${lugar} APLICACIÓN DE A.T.S..${extraTxt} REPONE Y REANUDA${minTxt}.-`;
        l3 = `C/A: M. RODANTE, VIDEO MKS, AUX. BOULOGNE (POR INFORME).-`;
        break;
      case "HV":
        l2 = `INF. EN ${lugar} APLICACIÓN DE HOMBRE VIVO.${extraTxt} REPONE Y REANUDA${minTxt}.-`;
        l3 = `C/A: MATERIAL RODANTE, VIDEO MKS, AUX. BOULOGNE (POR INFORME).-`;
        break;
      case "PRECAUCION":
        l1 = `SUPERVISIÓN PCZ - T/${tren} LOC.${loc}${cochesTxt}`;
        l2 = `NOTIFICA PRECAUCIÓN EN ${lugar}.${extraTxt} REANUDA MARCHA.-`;
        l3 = `C/A: CONTROL, DIAGRAMA, SUPERVISIÓN CABECERA.-`;
        break;
      case "FRENO":
        l2 = `INF. EN ${lugar} DETENCIÓN POR FORMACIÓN FRENADA.${extraTxt} REANUDA${minTxt}.-`;
        l3 = `C/A: MATERIAL RODANTE, AUX. BOULOGNE (POR INFORME).-`;
        break;
      case "TRACCION":
        l2 = `INF. EN ${lugar} PÉRDIDA DE MARCHA POR POCA POTENCIA/TRACCIÓN.${extraTxt} CONTINÚA${minTxt}.-`;
        l3 = `C/A: MATERIAL RODANTE, AUX. BOULOGNE (POR INFORME).-`;
        break;
      case "CAMBIO_LOC":
        l2 = `INF. EN ${lugar} RECAMBIO DE UNIDAD TRACCIÓN.${extraTxt} CONTINÚA ROTACIÓN${minTxt}.-`;
        l3 = `C/A: MATERIAL RODANTE, DIAGRAMA, AUX. BOULOGNE.-`;
        break;
      case "LUZ_PUERTA":
        l2 = `INF. EN ${lugar} ATENCIÓN DE MATERIAL RODANTE EN COCHES.${extraTxt} REANUDA${minTxt}.-`;
        l3 = `C/A: MATERIAL RODANTE, AUX. BOULOGNE.-`;
        break;
      case "CAIDA":
        l2 = `INF. DETENIDO EN ${lugar} POR PASAJERO QUE DESCENDIÓ EN MOVIMIENTO CAYENDO A PLATAFORMA.${extraTxt} REANUDA MARCHA${minTxt}.-`;
        l3 = `C/A: RESGUARDO, VIDEO MKS, AUX. BOULOGNE (INFORME Y ACTA).-`;
        break;
      case "DESCOMP":
        l2 = `INF. DETENIDO EN ${lugar} POR PASAJERO DESCOMPUESTO A BORDO.${extraTxt} REANUDA${minTxt}.-`;
        l3 = `C/A: RESGUARDO, SERVICIO MÉDICO, AUX. BOULOGNE (INFORME Y ACTA).-`;
        break;
      case "POLICIA":
        l2 = `INF. DETENIDO EN ${lugar} POR INTERVENCIÓN POLICIAL A BORDO.${extraTxt} REANUDA${minTxt}.-`;
        l3 = `C/A: RESGUARDO, POLICÍA FEDERAL / PROVINCIA, AUX. BOULOGNE.-`;
        break;
      case "ARREBATO":
        l2 = `INF. EN ${lugar} ARREBATO DE PERTENENCIAS A PASAJERO.${extraTxt} REANUDA${minTxt}.-`;
        l3 = `C/A: RESGUARDO, VIDEO MKS, POLICÍA FEDERAL, AUX. BOULOGNE.-`;
        break;
      case "APEDREO":
        l2 = `INF. EN ${lugar} APEDREO A LA FORMACIÓN.${extraTxt} CONTINÚA${minTxt}.-`;
        l3 = `C/A: RESGUARDO, VIDEO MKS, MATERIAL RODANTE, AUX. BOULOGNE.-`;
        break;
      case "VIA":
        l2 = `INF. EN ${lugar} FRENO DE EMERGENCIA PREVENTIVO POR PERSONAS EN ZONA DE VÍAS.${extraTxt} REANUDA${minTxt}.-`;
        l3 = `C/A: RESGUARDO, VIDEO MKS, AUX. BOULOGNE (POR INFORME).-`;
        break;
      case "OBITO":
        l2 = `INF. EN ${lugar} ACCIDENTE DE PERSONA CON ÓBITO SOBRE VÍA.${extraTxt} VÍA OBSTRUIDA.-`;
        l3 = `C/A: LEGALES, RESGUARDO, SEG. OPERATIVA, SERVICIO MÉDICO, CIENTÍFICA.-`;
        break;
      case "CABALLOS":
        l2 = `INF. EN ${lugar} ANIMALES EQUINOS EN ZONA DE VÍAS.${extraTxt} CIRCULA A LA VISTA.-`;
        l3 = `C/A: RESGUARDO, CONTROL DE TRÁFICO.-`;
        break;
      case "CUSTODIA":
        l2 = `INF. DEMORADO EN ${lugar} POR FALTA DE CUSTODIA POLICIAL.${extraTxt} REANUDA${minTxt}.-`;
        l3 = `C/A: RESGUARDO, GUARDIA DE TRANSPORTE.-`;
        break;
      case "PAN":
        l2 = `INF. P.A.N. ${lugar} NOVEDAD EN BARRERAS.${extraTxt} CIRCULA CON PRECAUCIÓN.-`;
        l3 = `C/A: SEÑALAMIENTO, RESGUARDO (PARA CUSTODIA).-`;
        break;
      case "SENAL":
        l2 = `INF. EN ${lugar} FALLA DE SEÑALAMIENTO / CIRCUITO OCUPADO.${extraTxt} FRANQUEA A PELIGRO${minTxt}.-`;
        l3 = `C/A: SEÑALAMIENTO, SUPERVISIÓN RETIRO / BOULOGNE.-`;
        break;
      case "CAMBIO_ADV":
        l2 = `INF. EN ${lugar} APARATO DE VÍA FUERA DE CORRESPONDENCIA.${extraTxt} MANIOBRA MANUAL${minTxt}.-`;
        l3 = `C/A: SEÑALAMIENTO, GUARDIA DE VÍA, SUPERVISIÓN.-`;
        break;
      case "OBRA":
        l1 = `INSP. VÍA Y OBRAS - SECTOR ${lugar}`;
        l2 = `ENTREGA / RECEPCIÓN DE VÍA SEGÚN CONSIGNA.${extraTxt}-`;
        l3 = `C/A: GUARDIA DE VÍA, RESGUARDO, CONTROL CIRCULACIÓN.-`;
        break;
    }

    const textoFinal = `${l1}\\n${l2}\\n${l3}\\n\\n[CARGA: ${cfg.carga} | AVISOS: ${cfg.avisos}]`;
    document.getElementById("salidaTexto").value = textoFinal;
  }

  function copiarAlPortapapeles() {
    const area = document.getElementById("salidaTexto");
    area.select();
    area.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(area.value).then(() => {
      alert("✅ ¡Copiado al portapapeles listo para pegar!");
    });
  }

  actualizarPlantilla();
</script>

</body>
</html>
